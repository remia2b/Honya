name: Capturer des écrans

# Voir l'application SANS lancer de construction payante : le simulateur iOS
# des machines GitHub suffit pour ouvrir un écran et le photographier.
#
# L'application accepte « --ecran <nom> » en compilation de débogage, ce qui
# évite d'avoir à naviguer : on ouvre directement l'écran voulu.
#
# Lancement : gh workflow run capture.yml

on:
  workflow_dispatch:
    inputs:
      ecrans:
        description: "Écrans à photographier, séparés par des espaces"
        default: "accueil verrou honyaPlus roue"

jobs:
  capturer:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compiler pour le simulateur
        run: |
          set -o pipefail
          xcodebuild build \
            -project Honya.xcodeproj \
            -scheme Honya \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO \
            | tail -5

      - name: Démarrer un iPhone
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[A-F0-9-]{36}')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          APP=$(find /tmp/dd/Build/Products -name "Honya.app" -maxdepth 2 | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          xcrun simctl install "$UDID" "$APP"

      - name: Photographier chaque écran
        run: |
          mkdir -p /tmp/captures
          for theme in light dark; do
            xcrun simctl ui "$UDID" appearance "$theme"
            for ecran in ${{ inputs.ecrans }}; do
              echo "── $theme / $ecran"
              xcrun simctl terminate "$UDID" com.remiabbou.honya 2>/dev/null || true
              if [ "$ecran" = "accueil" ]; then
                xcrun simctl launch "$UDID" com.remiabbou.honya
              else
                xcrun simctl launch "$UDID" com.remiabbou.honya --ecran "$ecran"
              fi
              # Seuls les écrans à couvertures attendent le réseau.
              case "$ecran" in
                accueil|honyaPlus|scanner) sleep 15 ;;
                *) sleep 6 ;;
              esac
              xcrun simctl io "$UDID" screenshot "/tmp/captures/$theme-$ecran.png"
            done
          done
          ls -la /tmp/captures

      - name: Publier les captures
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: /tmp/captures/
