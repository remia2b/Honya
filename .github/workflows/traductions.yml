name: Traduire les nouveaux textes

# Tout texte ajouté à l'application doit exister dans les 14 langues avant
# d'arriver chez les utilisateurs : un écran à moitié traduit est pire qu'un
# écran en anglais, parce qu'il mélange deux langues dans la même phrase.
#
# Ce travail fait la chaîne complète, tout seul :
#   1. Xcode compile et extrait les chaînes traduisibles du code, avec leurs
#      vrais spécificateurs de format (%lld pour un entier, %@ pour un texte).
#      Les deviner à la main est une source d'erreurs invisibles à la
#      compilation, qui ne se voient qu'à l'exécution.
#   2. On compare l'extraction au catalogue et on fait traduire ce qui manque.
#   3. On vérifie chaque traduction (formats, alphabet) avant de l'écrire.
#   4. On committe.
#
# Lancement : automatique à chaque poussée touchant du code ou des textes,
# ou à la main avec `gh workflow run traductions.yml`.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Honya/**/*.swift'
      - 'Honya/Localizable.xcstrings'

permissions:
  contents: write

# Deux exécutions en parallèle se marcheraient dessus au moment du commit.
concurrency:
  group: traductions
  cancel-in-progress: false

jobs:
  traduire:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler (l'extraction se fait pendant la compilation)
        run: |
          # Sans pipefail, l'échec de xcodebuild est avalé par le tuyau vers
          # tail : l'extraction repartirait alors sur des .stringsdata
          # incomplets et écraserait la liste des clés par presque rien.
          set -o pipefail
          xcodebuild build \
            -project Honya.xcodeproj \
            -scheme Honya \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_EMIT_LOC_STRINGS=YES \
            | tail -20

      - name: Rassembler les clés extraites
        run: |
          mkdir -p /tmp/cles
          fichiers=$(find /tmp/dd -name '*.stringsdata' | sort)
          echo "$(echo "$fichiers" | wc -l) fichiers .stringsdata trouvés"
          for f in $fichiers; do
            plutil -convert json -o "/tmp/cles/$(basename "$f" .stringsdata).json" "$f" || true
          done
          python3 .github/rassembler_cles.py

      - name: Ajouter au catalogue les textes nouvellement repérés
        run: python3 .github/completer_catalogue.py

      - name: Traduire ce qui manque dans les 14 langues
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/traduire.py

      - name: Committer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Honya/Localizable.xcstrings Design/cles-extraites.json
          # `git diff` ignore les fichiers non suivis : on indexe d'abord.
          if git diff --cached --quiet; then
            echo "Rien de neuf à traduire."
            exit 0
          fi
          git commit -m "Traductions à jour dans les 14 langues [skip ci]"
          git push
