name: Extraire les clés de traduction

# Xcode extrait lui-même les chaînes traduisibles du code, avec les bons
# spécificateurs de format (%lld pour un entier, %@ pour un texte…). Deviner
# ces formats à la main est une source d'erreurs qui ne se voient qu'à
# l'exécution.
#
# `xcodebuild` en ligne de commande ne réécrit PAS Localizable.xcstrings —
# en revanche il produit des fichiers .stringsdata qui contiennent
# l'extraction. On les rassemble ici en un JSON lisible depuis Windows.
#
# Lancement manuel : gh workflow run traductions.yml

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraire:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler (l'extraction se fait pendant la compilation)
        run: |
          xcodebuild build \
            -project Honya.xcodeproj \
            -scheme Honya \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_EMIT_LOC_STRINGS=YES \
            | tail -20

      - name: Rassembler les clés extraites
        run: |
          mkdir -p /tmp/cles
          fichiers=$(find /tmp/dd -name '*.stringsdata' | sort)
          echo "$(echo "$fichiers" | wc -l) fichiers .stringsdata trouvés"
          for f in $fichiers; do
            plutil -convert json -o "/tmp/cles/$(basename "$f" .stringsdata).json" "$f" || true
          done

          python3 - <<'PY'
          import glob, json, os

          cles = {}
          for chemin in glob.glob("/tmp/cles/*.json"):
              with open(chemin, encoding="utf-8") as f:
                  donnees = json.load(f)
              for table in (donnees.get("tables") or {}).values():
                  for cle, detail in table.items():
                      if not cle:
                          continue
                      cles.setdefault(cle, detail if isinstance(detail, dict) else {})

          os.makedirs("Design", exist_ok=True)
          with open("Design/cles-extraites.json", "w", encoding="utf-8") as f:
              json.dump(sorted(cles), f, ensure_ascii=False, indent=1)
              f.write("\n")
          print(len(cles), "clés extraites")
          for c in sorted(k for k in cles if "%" in k)[:20]:
              print("  avec emplacement :", repr(c))
          PY

      - name: Committer la liste
        run: |
          if git diff --quiet -- Design/cles-extraites.json; then
            echo "Liste inchangée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Design/cles-extraites.json
          git commit -m "Clés de traduction extraites par Xcode [skip ci]"
          git push
