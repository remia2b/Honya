name: Vérification de compilation

# Gratuit : les runners macOS de GitHub compilent le projet à chaque push,
# ce qui préserve les minutes Codemagic pour les envois TestFlight.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build simulateur (sans signature)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Environnement Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphone" || true

      - name: Compiler
        run: |
          set -o pipefail
          xcodebuild build \
            -project Honya.xcodeproj \
            -scheme Honya \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Erreurs de compilation
        if: failure()
        run: |
          echo "--- Erreurs ---"
          grep -E "error:|warning: .*deprecated" build.log | head -60 || true
