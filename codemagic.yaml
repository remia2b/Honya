# Codemagic — build signé pour TestFlight.
# La simple vérification de compilation est faite gratuitement par GitHub Actions
# (.github/workflows/build.yml) : Codemagic n'est sollicité que pour publier.
#
# Déclenchement : chaque push sur `main`, un tag « v* », ou un lancement
# manuel depuis l'interface Codemagic. L'envoi vise TestFlight, jamais l'App Store.

workflows:
  testflight:
    name: Honya · Archive signée → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    # Nom de l'intégration telle qu'elle est enregistrée dans Codemagic
    # (Teams → Integrations → Developer Portal) — PAS le nom de la clé côté Apple.
    # Cette clé porte l'Issuer ID + Key ID + .p8 et gère la signature.
    integrations:
      app_store_connect: Binjo ASC key
    # Honya est reliée à `main` dans Codemagic : chaque push produit le build
    # TestFlight demandé par le propriétaire. Les tags `v*` restent acceptés
    # pour les jalons explicites.
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true
    environment:
      xcode: latest
      groups:
        # Groupe de variables Codemagic contenant CERTIFICATE_PRIVATE_KEY_B64,
        # la clé privée du certificat de distribution déjà utilisé par Binjo.
        # Elle est obligatoire : le compte Apple ne peut plus créer de certificat.
        - signing
      vars:
        BUNDLE_ID: com.remiabbou.honya
    scripts:
      - name: Injecter les secrets (jamais dans le depot)
        script: |
          # Variables chiffrees Codemagic (groupe « signing »), ecrites dans
          # Secrets.swift sur la machine de build uniquement :
          #   SUPABASE_URL, SUPABASE_ANON_KEY
          # GOOGLE_BOOKS_API_KEY et les trois flags HONYA_* ne sont utilisables
          # qu'après accord écrit/validation des conditions des fournisseurs.
          cat > Honya/Config/Secrets.swift <<SWIFT
          import Foundation

          // Genere par la CI - ne pas committer.
          enum Secrets {
              static let cleGoogleBooks = "${GOOGLE_BOOKS_API_KEY:-}"
              static let supabaseURL = "${SUPABASE_URL:-}"
              static let supabaseCleAnon = "${SUPABASE_ANON_KEY:-}"
          }
          SWIFT
          echo "Google Books : ${#GOOGLE_BOOKS_API_KEY} caracteres."
          echo "Supabase URL : ${#SUPABASE_URL} caracteres, cle anon : ${#SUPABASE_ANON_KEY} caracteres."
          if [ "${HONYA_GOOGLE_BOOKS_LICENSED:-NO}" = "YES" ] && [ -z "${GOOGLE_BOOKS_API_KEY:-}" ]; then
            echo "ERREUR : Google Books est declare autorise mais sa cle API manque."
            exit 1
          fi
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERREUR : Supabase non configure alors que la connexion par e-mail est visible."
            exit 1
          fi

          # Les réglages du projet restent NO par défaut. La CI ne les ouvre
          # que si la variable sécurisée correspondante a été posée après
          # validation juridique et mise en conformité de l'UX.
          PBX=Honya.xcodeproj/project.pbxproj
          for SOURCE in GOOGLE_BOOKS_LICENSED APPLE_BOOKS_PROMO_COMPLIANT ANILIST_LICENSED; do
            case "$SOURCE" in
              GOOGLE_BOOKS_LICENSED) VALUE="${HONYA_GOOGLE_BOOKS_LICENSED:-NO}" ;;
              APPLE_BOOKS_PROMO_COMPLIANT) VALUE="${HONYA_APPLE_BOOKS_PROMO_COMPLIANT:-NO}" ;;
              ANILIST_LICENSED) VALUE="${HONYA_ANILIST_LICENSED:-NO}" ;;
            esac
            if [ "$VALUE" = "YES" ]; then
              if ! grep -q "INFOPLIST_KEY_HONYA_${SOURCE} = NO;" "$PBX"; then
                echo "ERREUR : réglage HONYA_${SOURCE}=NO introuvable dans le projet."
                exit 1
              fi
              sed -i '' "s/INFOPLIST_KEY_HONYA_${SOURCE} = NO;/INFOPLIST_KEY_HONYA_${SOURCE} = YES;/g" "$PBX"
              if ! grep -q "INFOPLIST_KEY_HONYA_${SOURCE} = YES;" "$PBX"; then
                echo "ERREUR : HONYA_${SOURCE} n'a pas été activé dans le projet."
                exit 1
              fi
            fi
          done
      - name: Signature (certificat + profil App Store)
        script: |
          set -o pipefail
          keychain initialize
          # fetch-signing-files a besoin de la CLÉ PRIVÉE du certificat de distribution :
          # sans elle il ne télécharge aucun profil — sans message d'erreur — et l'archive
          # échoue plus loin sur « requires a provisioning profile ».
          if [ -z "${CERTIFICATE_PRIVATE_KEY_B64:-}" ]; then
            echo "❌ CERTIFICATE_PRIVATE_KEY_B64 absente du groupe « signing »."
            echo "   Sans la clé privée d'un certificat existant, la signature est impossible :"
            echo "   le compte a déjà 3 certificats de distribution et Apple refuse d'en créer"
            echo "   un de plus (HTTP 409). À définir dans Codemagic → Honya → Environment"
            echo "   variables, groupe « signing », valeur = clé PEM encodée en base64."
            exit 1
          fi
          # Le runner est macOS : son utilitaire BSD emploie `-D` pour décoder.
          printf '%s' "$CERTIFICATE_PRIVATE_KEY_B64" | /usr/bin/base64 -D > /tmp/cert_key
          openssl rsa -in /tmp/cert_key -noout -check
          echo "Clé privée chargée depuis le groupe « signing »."
          echo "=== Ce que la clé API voit sur le compte Apple ==="
          echo "--- Identifiant d'app $BUNDLE_ID ---"
          app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" 2>&1 | head -30 || true
          echo "--- Certificats de distribution (nom, id, expiration) ---"
          app-store-connect certificates list --type DISTRIBUTION 2>&1 | head -60 || true
          echo "--- Profils existants ---"
          app-store-connect profiles list 2>&1 | head -60 || true

          echo "=== Récupération / création des fichiers de signature ==="
          # --create : crée le profil manquant pour ce bundle, et le certificat au besoin.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key \
            --create 2>&1 | tee /tmp/fetch.log

          keychain add-certificates

          echo "=== Résultat ==="
          echo "--- Profils installés ---"
          find "$HOME/Library" -name '*.mobileprovision' 2>/dev/null || true
          echo "--- Certificats dans le trousseau ---"
          security find-identity -v -p codesigning 2>&1 | head -10 || true

      - name: Configurer le profil dans le projet Xcode
        script: |
          # Le dossier des profils a changé avec Xcode 16 (~/Library/Developer/Xcode/
          # UserData/… au lieu de ~/Library/MobileDevice/…) : on cherche par contenu
          # plutôt que par chemin, ce qui reste vrai quelle que soit la version.
          PROFILE=""
          while IFS= read -r candidate; do
            [ -f "$candidate" ] || continue
            PROFILE_PLIST=$(security cms -D -i "$candidate" 2>/dev/null) || continue
            APP_ID=$(printf '%s' "$PROFILE_PLIST" \
              | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || true)
            case "$APP_ID" in *"$BUNDLE_ID") ;; *) continue ;; esac

            # `fetch-signing-files --type IOS_APP_STORE` vient de filtrer le
            # type et la validité côté Apple. Les représentations `plutil raw`
            # des booléens et des dates ont changé avec Xcode 26 et rejetaient
            # à tort ce profil pourtant exact. Ici, la preuve déterminante est
            # l'application-identifier complet (Team ID + bundle ID).
            PROFILE="$candidate"
            break
          done <<< "$(find "$HOME/Library" -name '*.mobileprovision' 2>/dev/null)"

          if [ -z "$PROFILE" ]; then
            echo "❌ Aucun profil ne correspond à $BUNDLE_ID. Profils trouvés :"
            find "$HOME/Library" -name '*.mobileprovision' 2>/dev/null | while IFS= read -r p; do
              ID=$(security cms -D -i "$p" 2>/dev/null \
                | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || echo "illisible")
              echo "  - $p → $ID"
            done
            exit 1
          fi

          PROFILE_PLIST=$(security cms -D -i "$PROFILE")
          UUID=$(printf '%s' "$PROFILE_PLIST" | plutil -extract UUID raw -)
          NAME=$(printf '%s' "$PROFILE_PLIST" | plutil -extract Name raw -)
          echo "Profil retenu : $NAME ($UUID)"

          # Méthode officielle Codemagic : fournir explicitement l'unique
          # profil déjà validé, ainsi que la méthode d'archive. La commande
          # configure les variantes SDK et génère ~/export_options.plist.
          xcode-project use-profiles \
            --project Honya.xcodeproj \
            --profile "$PROFILE" \
            --archive-method app-store \
            --code-signing-setup-verbose-logging

          echo "--- Réglages de signature retenus par Xcode ---"
          xcodebuild -project Honya.xcodeproj -scheme Honya -showBuildSettings 2>/dev/null \
            | grep -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE" \
            | sort -u
      - name: Numéro de build incrémental
        script: agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Archive et export de l'IPA
        script: |
          xcode-project build-ipa \
            --project Honya.xcodeproj \
            --scheme Honya \
            --export-options-plist "$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Le push `main` ou le tag de release téléverse l'IPA puis lance le
        # post-traitement TestFlight. L'affectation à un groupe précis restera
        # manuelle tant que son nom App Store Connect n'est pas versionné ici.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - remiabbou@gmail.com
        notify:
          success: false
          failure: true
