# Codemagic — build signé pour TestFlight.
# La simple vérification de compilation est faite gratuitement par GitHub Actions
# (.github/workflows/build.yml) : Codemagic n'est sollicité que pour publier.
#
# Déclenchement : pousser un tag « v* » (ex. git tag v0.1 && git push origin v0.1),
# ou lancer le workflow à la main depuis l'interface Codemagic.

workflows:
  testflight:
    name: Honya · Archive signée → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    # Nom de l'intégration telle qu'elle est enregistrée dans Codemagic
    # (Teams → Integrations → Developer Portal) — PAS le nom de la clé côté Apple.
    # Cette clé porte l'Issuer ID + Key ID + .p8 et gère la signature.
    integrations:
      app_store_connect: Binjo ASC key
    # Pendant la mise au point du pipeline : chaque push sur main relance le build,
    # pour ne pas avoir à le lancer à la main à chaque correction. Une fois la
    # chaîne verte, retirer « push » et ne garder que les tags — un build Codemagic
    # est facturé, alors que la compilation de contrôle est gratuite sur GitHub.
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true
    environment:
      xcode: latest
      groups:
        # Groupe de variables Codemagic contenant CERTIFICATE_PRIVATE_KEY_B64,
        # la clé privée du certificat de distribution déjà utilisé par Binjo.
        # Absent ? Le build crée alors son propre certificat (voir l'étape Signature).
        - signing
      vars:
        BUNDLE_ID: com.remiabbou.honya
    scripts:
      - name: Signature (certificat + profil App Store)
        script: |
          keychain initialize
          # fetch-signing-files a besoin de la CLÉ PRIVÉE du certificat de distribution :
          # sans elle il ne télécharge aucun profil — sans message d'erreur — et l'archive
          # échoue plus loin sur « requires a provisioning profile ».
          if [ -n "${CERTIFICATE_PRIVATE_KEY_B64:-}" ]; then
            echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > /tmp/cert_key
            echo "Clé privée reprise du groupe « signing » : le certificat existant est réutilisé."
          else
            openssl genrsa -out /tmp/cert_key 2048
            echo "⚠️  CERTIFICATE_PRIVATE_KEY_B64 absente : création d'un nouveau certificat."
            echo "    Apple en limite le nombre — conserver cette clé pour les builds suivants."
          fi
          # --create : crée le profil manquant pour ce bundle, et le certificat au besoin.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key \
            --create
          keychain add-certificates
          # Génère aussi ~/export_options.json, dont build-ipa a besoin pour l'export.
          xcode-project use-profiles --project Honya.xcodeproj
          echo "--- Profils présents sur la machine après récupération ---"
          find "$HOME/Library" -name '*.mobileprovision' 2>/dev/null || echo "(aucun)"
      - name: Inscrire le profil dans le projet Xcode
        script: |
          # « xcode-project use-profiles » n'écrit rien dans ce projet : il est généré
          # à la main au format « dossiers synchronisés » (objectVersion 70). Sans
          # PROVISIONING_PROFILE_SPECIFIER, l'archive s'arrête sur « requires a
          # provisioning profile ». On applique donc les réglages nous-mêmes, à partir
          # du profil réellement installé à l'étape précédente.
          # Le dossier des profils a changé avec Xcode 16 (~/Library/Developer/Xcode/
          # UserData/… au lieu de ~/Library/MobileDevice/…) : on cherche par contenu
          # plutôt que par chemin, ce qui reste vrai quelle que soit la version.
          PROFILE=""
          while IFS= read -r candidate; do
            [ -f "$candidate" ] || continue
            APP_ID=$(security cms -D -i "$candidate" 2>/dev/null \
              | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || true)
            case "$APP_ID" in
              *"$BUNDLE_ID") PROFILE="$candidate"; break ;;
            esac
          done <<< "$(find "$HOME/Library" -name '*.mobileprovision' 2>/dev/null)"

          if [ -z "$PROFILE" ]; then
            echo "❌ Aucun profil ne correspond à $BUNDLE_ID. Profils trouvés :"
            find "$HOME/Library" -name '*.mobileprovision' 2>/dev/null | while IFS= read -r p; do
              ID=$(security cms -D -i "$p" 2>/dev/null \
                | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || echo "illisible")
              echo "  - $p → $ID"
            done
            exit 1
          fi

          PROFILE_PLIST=$(security cms -D -i "$PROFILE")
          UUID=$(printf '%s' "$PROFILE_PLIST" | plutil -extract UUID raw -)
          NAME=$(printf '%s' "$PROFILE_PLIST" | plutil -extract Name raw -)
          echo "Profil retenu : $NAME ($UUID)"

          # Le format pbxproj accepte plusieurs réglages sur une même ligne.
          PBX=Honya.xcodeproj/project.pbxproj
          sed -i '' "s|CODE_SIGN_STYLE = Automatic;|CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"$UUID\";|g" "$PBX"

          echo "--- Réglages de signature retenus par Xcode ---"
          xcodebuild -project Honya.xcodeproj -scheme Honya -showBuildSettings 2>/dev/null \
            | grep -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE" \
            | sort -u
      - name: Numéro de build incrémental
        script: agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Archive et export de l'IPA
        script: |
          xcode-project build-ipa \
            --project Honya.xcodeproj \
            --scheme Honya
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # L'IPA est envoyé sur App Store Connect : il devient disponible pour le
        # TEST INTERNE TestFlight sans revue Apple. On ne soumet pas au test externe
        # (qui exigerait un formulaire d'infos beta et une revue).
      email:
        recipients:
          - remiabbou@gmail.com
        notify:
          success: false
          failure: true
