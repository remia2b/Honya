# Codemagic — build signé pour TestFlight.
# La simple vérification de compilation est faite gratuitement par GitHub Actions
# (.github/workflows/build.yml) : Codemagic n'est sollicité que pour publier.
#
# Déclenchement : pousser un tag « v* » (ex. git tag v0.1 && git push origin v0.1),
# ou lancer le workflow à la main depuis l'interface Codemagic.
#
# Prérequis dans Codemagic : Teams → Integrations → Developer Portal,
# clé API App Store Connect (.p8 + Issuer ID + Key ID) enregistrée sous le nom
# indiqué dans « integrations → app_store_connect » ci-dessous.
#
# La signature n'utilise pas le bloc « ios_signing » : celui-ci exige un profil de
# provisioning préexistant et échoue sur un nouveau bundle (« No matching profiles
# found »). On appelle donc fetch-signing-files avec --create, qui crée le profil
# App Store (et le certificat de distribution s'il manque) à la première exécution.

workflows:
  testflight:
    name: Honya · Archive signée → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    # « integrations » se déclare au niveau du workflow, jamais sous « environment ».
    integrations:
      app_store_connect: Codemagic
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.remiabbou.honya
    scripts:
      - name: Préparer la signature (crée le profil au premier passage)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Numéro de build incrémental
        script: agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Archive et export de l'IPA
        script: |
          xcode-project build-ipa \
            --project Honya.xcodeproj \
            --scheme Honya
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
