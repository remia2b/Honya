# Codemagic — build signé pour TestFlight.
# La simple vérification de compilation est faite gratuitement par GitHub Actions
# (.github/workflows/build.yml) : Codemagic n'est sollicité que pour publier.
#
# Déclenchement : pousser un tag « v* » (ex. git tag v0.1 && git push origin v0.1),
# ou lancer le workflow à la main depuis l'interface Codemagic.
#
# Prérequis dans Codemagic : Teams → Integrations → Developer Portal,
# clé API App Store Connect (.p8 + Issuer ID + Key ID) enregistrée sous le nom
# indiqué dans « integrations → app_store_connect » ci-dessous.

workflows:
  testflight:
    name: Honya · Archive signée → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.remiabbou.honya
      integrations:
        app_store_connect: Codemagic
      vars:
        BUNDLE_ID: com.remiabbou.honya
    scripts:
      - name: Installer les profils de signature
        script: xcode-project use-profiles
      - name: Numéro de build incrémental
        script: agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Archive et export de l'IPA
        script: |
          xcode-project build-ipa \
            --project Honya.xcodeproj \
            --scheme Honya
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
