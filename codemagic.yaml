# Codemagic — build signé pour TestFlight.
# La simple vérification de compilation est faite gratuitement par GitHub Actions
# (.github/workflows/build.yml) : Codemagic n'est sollicité que pour publier.
#
# Déclenchement : pousser un tag « v* » (ex. git tag v0.1 && git push origin v0.1),
# ou lancer le workflow à la main depuis l'interface Codemagic.

workflows:
  testflight:
    name: Honya · Archive signée → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    # Nom de l'intégration telle qu'elle est enregistrée dans Codemagic
    # (Teams → Integrations → Developer Portal) — PAS le nom de la clé côté Apple.
    # Cette clé porte l'Issuer ID + Key ID + .p8 et gère la signature.
    integrations:
      app_store_connect: Binjo ASC key
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.remiabbou.honya
    scripts:
      - name: Signature (crée le profil App Store au premier passage)
        script: |
          keychain initialize
          # Le bloc « ios_signing » exigerait un profil PRÉEXISTANT et échoue sur un
          # bundle neuf (« No matching profiles found »). fetch-signing-files --create
          # crée le profil manquant pour ce bundle, et le certificat de distribution
          # s'il n'y en a pas encore d'utilisable.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Numéro de build incrémental
        script: agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Archive et export de l'IPA
        script: |
          xcode-project build-ipa \
            --project Honya.xcodeproj \
            --scheme Honya
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # L'IPA est envoyé sur App Store Connect : il devient disponible pour le
        # TEST INTERNE TestFlight sans revue Apple. On ne soumet pas au test externe
        # (qui exigerait un formulaire d'infos beta et une revue).
      email:
        recipients:
          - remiabbou@gmail.com
        notify:
          success: false
          failure: true
